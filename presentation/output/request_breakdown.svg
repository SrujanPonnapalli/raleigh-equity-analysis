<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <rect width="1100" height="700" fill="none"/>
  <text x="550" y="58" text-anchor="middle" font-family="Open Sans, sans-serif"
        font-size="22" font-weight="600" fill="#1B2838">Why We Break the Data Apart</text>

  <!-- Main bucket -->
  <rect x="280" y="145" width="440" height="185" rx="18" fill="#E8EDF2" stroke="#1B2838" stroke-width="2.5"/>
  <rect x="262" y="125" width="476" height="28" rx="10" fill="#E8EDF2" stroke="#1B2838" stroke-width="2.5"/>
  <text x="500" y="225" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="18" font-weight="600" fill="#1B2838">All 311 Requests</text>
  <text x="500" y="252" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="13" font-weight="400" fill="#5A6B7D">Mixed tasks, mixed wait times</text>

  <!-- Arrows -->
  <line x1="330" y1="330" x2="190" y2="410" stroke="#5A6B7D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="330" x2="500" y2="410" stroke="#5A6B7D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="330" x2="810" y2="410" stroke="#5A6B7D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5A6B7D"/>
    </marker>
  </defs>

  <!-- Child buckets -->
  <g>
    <rect x="75" y="430" width="210" height="155" rx="14" fill="#E8F0F8" stroke="#1B2838" stroke-width="2.5"/>
    <rect x="62" y="412" width="236" height="24" rx="8" fill="#E8F0F8" stroke="#1B2838" stroke-width="2.5"/>
    <text x="180" y="495" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="17" font-weight="600" fill="#1B2838">Potholes</text>
    <text x="180" y="520" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="12" font-weight="400" fill="#5A6B7D">Fast, uniform</text>
  </g>
  <g>
    <rect x="395" y="430" width="210" height="155" rx="14" fill="#D4EDE6" stroke="#1B2838" stroke-width="2.5"/>
    <rect x="382" y="412" width="236" height="24" rx="8" fill="#D4EDE6" stroke="#1B2838" stroke-width="2.5"/>
    <text x="500" y="495" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="17" font-weight="600" fill="#1B2838">Parks</text>
    <text x="500" y="520" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="12" font-weight="400" fill="#5A6B7D">Mixed workload</text>
  </g>
  <g>
    <rect x="715" y="430" width="210" height="155" rx="14" fill="#FCE8E6" stroke="#1B2838" stroke-width="2.5"/>
    <rect x="702" y="412" width="236" height="24" rx="8" fill="#FCE8E6" stroke="#1B2838" stroke-width="2.5"/>
    <text x="820" y="495" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="17" font-weight="600" fill="#1B2838">Trees</text>
    <text x="820" y="520" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="12" font-weight="400" fill="#5A6B7D">Highly variable</text>
  </g>

  <text x="550" y="665" text-anchor="middle" font-family="Open Sans, sans-serif" font-size="12" font-weight="400" fill="#5A6B7D">One average hides three very different citizen experiences</text>
</svg>
